services:
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    environment:
      - PYTHONUNBUFFERED=1
    # Important: keeps the SQLite logs persistent on the host machine

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    ports:
      - "8501:8501"
    environment:
      # Tell Streamlit to connect to the backend container, not localhost
      - API_URL=http://backend:8000
    depends_on:
      - backend
